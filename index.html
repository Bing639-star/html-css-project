<!-- 注册页内容 -->
<div class="tab-content" id="register">
    <div class="register-page">
        <div class="register-box">
            <h2>用户注册</h2>
            <form id="registerForm">
                <div class="form-item">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入3-16位字母/数字/下划线">
                    <div class="form-tip">用户名格式错误</div>
                </div>
                <div class="form-item">
                    <label for="phone">手机号</label>
                    <input type="tel" id="phone" placeholder="请输入11位手机号">
                    <div class="form-tip">手机号格式错误</div>
                </div>
                <div class="form-item">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入6-20位密码">
                    <div class="form-tip">密码长度不符合要求</div>
                </div>
                <div class="form-item">
                    <label for="repassword">确认密码</label>
                    <input type="password" id="repassword" placeholder="请再次输入密码">
                    <div class="form-tip">两次密码不一致</div>
                </div>
                <button type="button" class="register-btn" onclick="submitForm()">立即注册</button>
            </form>
            <div class="login-link">已有账号？<a href="javascript:;">立即登录</a></div>
        </div>
    </div>
</div>
<script>
    // 1. Tab标签切换功能
    const tabNavs = document.querySelectorAll('.tab-nav li');
    const tabContents = document.querySelectorAll('.tab-content');
    tabNavs.forEach(nav => {
        nav.addEventListener('click', () => {
            // 移除所有active
            tabNavs.forEach(n => n.classList.remove('active'));
            tabContents.forEach(c => c.classList.remove('active'));
            // 添加当前active
            nav.classList.add('active');
            const tabId = nav.dataset.tab;
            document.getElementById(tabId).classList.add('active');
        });
    });

    // 2. 轮播图功能
    const carouselItems = document.querySelectorAll('.carousel-item');
    const dots = document.querySelectorAll('.indicator-dot');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');
    let currentIndex = 0;
    let carouselTimer;


    // 初始化轮播
    function initCarousel() {
        showItem(currentIndex);
        // 自动播放
        carouselTimer = setInterval(() => {
            nextItem();
        }, 5000);
        // 鼠标悬停暂停
        document.querySelector('.carousel').addEventListener('mouseenter', () => {
            clearInterval(carouselTimer);
        });
        // 鼠标离开继续
        document.querySelector('.carousel').addEventListener('mouseleave', () => {
            carouselTimer = setInterval(() => {
                nextItem();
            }, 5000);
        });
    }
</script>
